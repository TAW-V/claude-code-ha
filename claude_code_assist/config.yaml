name: Claude Code Assist
version: "0.10.7"
slug: claude_code_assist
description: Claude Code (your own subscription) as a Home Assistant conversation agent, with tool use
url: "https://github.com/TAW-V/claude-code-ha"
arch:
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Claude Code
panel_admin: true
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: false
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: addons
    read_only: false
  - type: share
    read_only: false
  - type: backup
    read_only: true
  - type: media
    read_only: false
  - type: all_addon_configs
    read_only: false
    path: /addon_configs
options:
  oauth_token: ""
  model: sonnet
  timeout_seconds: 180
  compact_hour: 4
  followup_wait_seconds: 240
  task_max_minutes: 30
  auto_update_claude: true
  extra_instructions: ""
schema:
  oauth_token: password
  model: str
  effort: list(low|medium|high|xhigh|max)?
  timeout_seconds: int(30,600)
  compact_hour: int(0,23)
  followup_wait_seconds: int(0,290)
  task_max_minutes: int(1,240)
  auto_update_claude: bool
  extra_instructions: str?
