<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Assist</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --fg: #212121; --muted: #666; --line: #ddd; --accent: #03a9f4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1c; --fg: #e1e1e1; --muted: #9b9b9b; --line: #333; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h1 { font-size: 20px; margin: 0; } h2 { font-size: 16px; margin: 0 0 8px; }
  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 16px; margin-top: 12px; }
  .status div span { display: block; color: var(--muted); font-size: 12px; }
  .status code { font-size: 12px; word-break: break-all; }
  .editor { flex: 1; display: flex; flex-direction: column; }
  textarea { flex: 1; min-height: 55vh; width: 100%; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { color: var(--muted); } .hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .tabs { display: flex; gap: 4px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
  .tabs button { border-radius: 999px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #chatView { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 12px; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.result { border-left: 3px solid var(--accent); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .bubble.user .meta { color: rgba(255,255,255,.8); }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; padding: 4px 12px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  .composer textarea { min-height: 44px; max-height: 30vh; flex: 1; resize: none; font: inherit; }
  main.chat { height: 100vh; min-height: 0; }
</style>
</head>
<body>
<main class="chat" id="main">
  <nav class="tabs">
    <button id="tabChat" class="active">Chat</button>
    <button id="tabSettings">Settings</button>
  </nav>

  <section id="chatView">
    <div id="log"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Claude Code…"></textarea>
      <button class="primary" id="btnSend">Send</button>
    </div>
    <div class="row" style="margin-top:0">
      <span class="msg" id="chatInfo"></span>
      <button id="btnClearChat" style="margin-left:auto">Clear history</button>
    </div>
  </section>

  <div id="settingsView" hidden>
  <section class="card">
    <h1>Claude Code Assist</h1>
    <div class="status">
      <div><span>Process</span><b id="running">…</b></div>
      <div><span>Model / effort</span><b id="model">…</b></div>
      <div><span>Last compaction</span><b id="compact">…</b></div>
      <div><span>Session</span><code id="session">…</code></div>
      <div><span>Background tasks</span><b id="tasks">…</b></div>
    </div>
    <div class="row" id="pendingRow" hidden>
      <span class="msg" id="pendingMsg"></span>
      <button id="btnRestart">Restart now</button>
    </div>
    <div class="row">
      <button id="btnCompact">Compact now</button>
      <button id="btnReset">Start new conversation</button>
      <span class="msg" id="sessionMsg"></span>
    </div>
  </section>

  <section class="card editor">
    <h2>Instructions (CLAUDE.md)</h2>
    <p class="hint">Standing instructions for the assistant: describe your home, preferences and rules. Saving reloads
      them for the next message (the conversation itself is kept).</p>
    <textarea id="text" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="btnSave" disabled>Save</button>
      <button id="btnRevert" disabled>Discard changes</button>
      <button id="btnDefault">Load default</button>
      <span class="msg" id="saveMsg"></span>
    </div>
  </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let saved = "";

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch("api/" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function dirty() {
  const changed = $("text").value !== saved;
  $("btnSave").disabled = !changed; $("btnRevert").disabled = !changed;
  if (changed) $("saveMsg").textContent = "Unsaved changes";
}

async function refresh(loadText) {
  const s = await api("status");
  $("running").textContent = s.running ? "running" : "idle (starts on next message)";
  $("model").textContent = `${s.model} / ${s.effort}`;
  $("compact").textContent = (s.last_compact ? s.last_compact.replace("T", " ") : "never") + ` · daily at ${s.compact_hour}:00`;
  $("session").textContent = s.session_id || "new conversation";
  $("tasks").textContent = s.background_tasks || "none";
  $("pendingRow").hidden = !s.restart_pending;
  $("pendingMsg").textContent = `New instructions are saved but not active yet: Claude Code restarts when its ${s.background_task_count} background task(s) finish.`;
  if (loadText) { saved = s.instructions; $("text").value = saved; dirty(); $("saveMsg").textContent = ""; }
}

$("text").addEventListener("input", dirty);
$("btnSave").onclick = async () => {
  $("btnSave").disabled = true; $("saveMsg").textContent = "Saving…";
  try { await api("instructions", { text: $("text").value }); saved = $("text").value; dirty();
        $("saveMsg").textContent = "Saved. Used from the next message once no background task is running."; refresh(false); }
  catch (e) { $("saveMsg").textContent = "Error: " + e.message; dirty(); }
};
$("btnRevert").onclick = () => { $("text").value = saved; dirty(); $("saveMsg").textContent = ""; };
$("btnDefault").onclick = async () => {
  const d = await api("instructions/default", {});
  $("text").value = d.instructions; dirty(); $("saveMsg").textContent = "Default loaded, not saved yet.";
};
$("btnCompact").onclick = async () => {
  await api("compact", {}); $("sessionMsg").textContent = "Compacting in the background…";
  setTimeout(() => refresh(false), 15000);
};
$("btnRestart").onclick = async () => {
  if (!confirm("Restart Claude Code now? Running background tasks are interrupted; their owners get a notice.")) return;
  await api("restart", {}); $("sessionMsg").textContent = "Restarted; new instructions apply from the next message."; refresh(false);
};
$("btnReset").onclick = async () => {
  if (!confirm("Start a new conversation? The assistant forgets the current conversation (memory files are kept).")) return;
  await api("reset", {}); $("sessionMsg").textContent = "Next message starts a new conversation."; refresh(false);
};
window.addEventListener("beforeunload", e => { if ($("text").value !== saved) e.preventDefault(); });
refresh(true).catch(e => { $("saveMsg").textContent = "Error: " + e.message; });
setInterval(() => refresh(false).catch(() => {}), 30000);

// ---------- tabs ----------
function show(tab) {
  const chat = tab === "chat";
  $("chatView").hidden = !chat; $("settingsView").hidden = chat;
  $("main").classList.toggle("chat", chat);
  $("tabChat").classList.toggle("active", chat); $("tabSettings").classList.toggle("active", !chat);
  if (chat) scrollDown();
}
$("tabChat").onclick = () => show("chat");
$("tabSettings").onclick = () => show("settings");

// ---------- chat ----------
let lastId = 0, sending = false;
const SOURCE = { assist: "via Assist", result: "background result", panel: "" };
function scrollDown() { const l = $("log"); l.scrollTop = l.scrollHeight; }
function addBubble(m) {
  const div = document.createElement("div");
  div.className = `bubble ${m.role}` + (m.source === "result" ? " result" : "");
  div.textContent = m.text;
  const meta = document.createElement("div");
  meta.className = "meta"; meta.textContent = [m.ts, SOURCE[m.source]].filter(Boolean).join(" · ");
  div.appendChild(meta);
  $("log").appendChild(div);
}
async function poll() {
  try {
    const nearBottom = $("log").scrollHeight - $("log").scrollTop - $("log").clientHeight < 80;
    const d = await api("chat?since=" + lastId);
    for (const m of d.messages) { addBubble(m); lastId = Math.max(lastId, m.id); }
    let typing = document.querySelector(".typing");
    if (d.pending && !typing) { typing = document.createElement("div"); typing.className = "typing"; typing.textContent = "Claude is working…"; $("log").appendChild(typing); }
    if (!d.pending && typing) typing.remove();
    if (typing) $("log").appendChild(typing);
    $("chatInfo").textContent = d.background_tasks ? "Running in the background: " + d.background_tasks : `Signed in as ${d.user}`;
    if (d.messages.length || d.pending) { if (nearBottom || d.messages.some(m => m.role === "user")) scrollDown(); }
  } catch (e) { $("chatInfo").textContent = "Error: " + e.message; }
}
async function send() {
  const text = $("input").value.trim();
  if (!text || sending) return;
  sending = true; $("btnSend").disabled = true;
  try { await api("chat/send", { text }); $("input").value = ""; autosize(); await poll(); scrollDown(); }
  catch (e) { $("chatInfo").textContent = "Error: " + e.message; }
  finally { sending = false; $("btnSend").disabled = false; $("input").focus(); }
}
function autosize() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, window.innerHeight * 0.3) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("btnSend").onclick = send;
$("btnClearChat").onclick = async () => {
  if (!confirm("Clear your chat history? (Claude's own conversation memory is not affected.)")) return;
  await api("chat/clear", {}); $("log").innerHTML = ""; lastId = 0; poll();
};
show("chat");
poll().then(scrollDown);
setInterval(poll, 2000);
</script>
</body>
</html>
